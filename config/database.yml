# PostgreSQL (Supabase in production).
#
# Development/test read PG_* env vars (with sensible local defaults) so you can
# point them at a local Postgres or your Supabase dev project. Production uses
# DATABASE_URL (the Supabase connection string set in Render).
#
# Solid Cache / Queue / Cable live in the SAME Postgres database as the app.
# Each is a named connection that loads its own schema file (db/*_schema.rb).

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  primary:
    <<: *default
    database: <%= ENV.fetch("PGDATABASE", "caplanner_development") %>
  cache:
    <<: *default
    database: <%= ENV.fetch("PGDATABASE", "caplanner_development") %>
    migrations_paths: db/cache_migrate
    schema_dump: cache_schema.rb
  queue:
    <<: *default
    database: <%= ENV.fetch("PGDATABASE", "caplanner_development") %>
    migrations_paths: db/queue_migrate
    schema_dump: queue_schema.rb
  cable:
    <<: *default
    database: <%= ENV.fetch("PGDATABASE", "caplanner_development") %>
    migrations_paths: db/cable_migrate
    schema_dump: cable_schema.rb

# The test database is erased and re-generated between test runs. Keep it
# separate from development.
test:
  primary:
    <<: *default
    database: <%= ENV.fetch("PGDATABASE_TEST", "caplanner_test") %>

# Production: everything on the Supabase Postgres database (DATABASE_URL).
production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    migrations_paths: db/cache_migrate
    schema_dump: cache_schema.rb
  queue:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    migrations_paths: db/queue_migrate
    schema_dump: queue_schema.rb
  cable:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
    migrations_paths: db/cable_migrate
    schema_dump: cable_schema.rb
