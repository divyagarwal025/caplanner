#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Morning brief: today's plan emailed to the user.
  morning_brief:
    class: MorningBriefJob
    schedule: every day at 7am

  # Nightly reflow: snapshot today, AI-adjust tomorrow's plan toward the exam
  # goal (carrying over any backlog), and email the user what to do next.
  nightly_replan:
    class: NightlyReplanJob
    schedule: every day at 10pm
