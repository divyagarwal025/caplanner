# Render Blueprint for Caplanner (CA Final study planner).
# Web + background worker on Render's native Ruby runtime; database is Supabase
# Postgres (set DATABASE_URL in the dashboard). No Redis — Action Cable uses
# Solid Cable, and background jobs use Solid Queue, both on Postgres.
#
# Secrets (DATABASE_URL, RAILS_MASTER_KEY, OPENAI_API_KEY, SMTP_*) are set in the
# Render dashboard, NOT in this file. sync:false marks env vars you must fill in.

services:
  # ---- Web ----
  - type: web
    name: caplanner
    runtime: ruby
    plan: free
    region: singapore          # closest to Asia/Kolkata; change if you prefer
    branch: main
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rails server"
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: RAILS_MAX_THREADS
        value: "3"
      # --- secrets: set these in the Render dashboard ---
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL          # Supabase Postgres connection string
        sync: false
      - key: OPENAI_API_KEY        # enables the AI guide / planner (optional)
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SMTP_ADDRESS
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: PLANNER_FROM
        sync: false

  # ---- Background worker (Solid Queue: nightly re-plan + emails) ----
  - type: worker
    name: caplanner-worker
    runtime: ruby
    plan: free
    region: singapore
    branch: main
    buildCommand: "bundle install"
    startCommand: "bundle exec bin/jobs"
    autoDeploy: true
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SMTP_ADDRESS
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: PLANNER_FROM
        sync: false
